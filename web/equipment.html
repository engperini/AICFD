<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 21h18M7 16h13M7 11h8' stroke='white' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<title>AICFD · equipment</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
    --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
    --paper:#ffffff;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19;
    --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --paper:#141413;
  }}
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19;
    --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --paper:#141413;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text-primary);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
  .brand{font-weight:650;letter-spacing:-.01em}
  .topbar .case{color:var(--text-secondary)}
  .spacer{flex:1}
  button,select{font:inherit;font-size:13px;padding:6px 13px;border-radius:8px;
    cursor:pointer;border:1px solid var(--border);background:transparent;
    color:var(--text-secondary)}
  button:hover:not(:disabled){color:var(--text-primary)}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--series-1);border-color:transparent;color:#fff;
    font-weight:600}
  a.ghost-button{font-size:13px;padding:6px 13px;border-radius:8px;
    text-decoration:none;border:1px solid var(--border);color:var(--text-secondary)}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;
    padding:16px;align-items:start}
  .column{display:flex;flex-direction:column;gap:16px;min-width:0}
  .card{background:var(--surface);border:1px solid var(--border);
    border-radius:12px;overflow:hidden}
  .card-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding:12px 16px;border-bottom:1px solid var(--border)}
  .card-title{font-weight:600}
  .card-sub{color:var(--text-muted);font-size:12.5px}
  .prose{padding:12px 16px;color:var(--text-secondary);font-size:13px}
  .prose b{color:var(--text-primary)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:6px 10px;text-align:right}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--text-muted);font-weight:500;font-size:11.5px;
    border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom:none}
  tbody input{width:100%;min-width:64px;padding:3px 6px;border-radius:6px;
    font:inherit;font-size:12.5px;text-align:right;background:var(--page);
    color:var(--text-primary);border:1px solid var(--border);
    font-variant-numeric:tabular-nums}
  tbody input:focus{outline:2px solid var(--series-1);outline-offset:-1px}
  .facts{width:100%;border-collapse:collapse;font-size:12.5px}
  .facts td{padding:5px 16px;border-bottom:1px solid var(--grid)}
  .facts td:first-child{color:var(--text-secondary)}
  .facts tr:last-child td{border-bottom:none}
  .actions{display:flex;gap:8px;align-items:center;padding:12px 16px;
    border-top:1px solid var(--border)}
  .note{color:var(--text-muted);font-size:11.5px}
  .chart{display:block;width:100%;height:auto;background:var(--paper)}
  .error{margin:32px auto;max-width:640px;padding:20px;border-radius:12px;
    border:1px solid var(--critical);color:var(--critical);background:var(--surface)}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  @media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">AICFD</span>
  <a class="ghost-button" href="./" style="text-decoration:none">← model</a>
  <span class="case" id="unit-name">loading…</span>
  <span class="spacer"></span>
  <select id="model-picker" aria-label="unit"></select>
  <button id="theme-toggle" type="button">Dark</button>
</header>

<div id="root"></div>

<script type="module" src="./equipment.js"></script>
</body>
</html>
