<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 21h18M7 16h13M7 11h8' stroke='white' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<title>AICFD</title>
<link rel="stylesheet" href="./drawing.css" />
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
    --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
    --series-4:#a3166b; --series-5:#e87ba4; --series-6:#008300;
    --series-7:#4a3aa7; --series-8:#e34948;
    --cold:#2a78d6; --hot:#d03b3b; --containment:#1baf7a;
    --solid:#6f6e6a; --rack:#d8d8d4; --paper:#ffffff;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19;
    --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --series-4:#cf62b0; --series-5:#d55181; --series-6:#008300;
    --series-7:#9085e9; --series-8:#e66767;
    --cold:#3987e5; --hot:#e66767; --containment:#199e70;
    --solid:#8e8d88; --rack:#2e2e2b; --paper:#141413;
  }}
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19;
    --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --series-4:#cf62b0; --series-5:#d55181; --series-6:#008300;
    --series-7:#9085e9; --series-8:#e66767;
    --cold:#3987e5; --hot:#e66767; --containment:#199e70;
    --solid:#8e8d88; --rack:#2e2e2b; --paper:#141413;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text-primary);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
  .brand{font-weight:650;letter-spacing:-.01em}
  .topbar .case{color:var(--text-secondary)}
  /* The case menu: a disclosure rather than a modal, so it cannot trap a
     reader and needs no overlay, no focus trap and no escape key. */
  .casemenu{position:relative}
  .casemenu>summary{cursor:pointer;list-style:none;padding:2px 8px;border-radius:6px;
    border:1px solid var(--border);background:var(--surface)}
  .casemenu>summary::-webkit-details-marker{display:none}
  .casemenu>summary::after{content:" ▾";color:var(--text-muted)}
  .casemenu>summary:hover{border-color:var(--text-muted)}
  .casemenu-panel{position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:440px;
    max-width:92vw;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
  .casemenu-head{font-size:10px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--text-muted);margin:10px 0 4px}
  .casemenu-head:first-child{margin-top:0}
  .casemenu-list{max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:2px}
  .casemenu-list a{display:flex;gap:8px;align-items:baseline;padding:4px 6px;
    border-radius:5px;text-decoration:none;color:var(--text-primary);font-size:13px}
  .casemenu-list a:hover{background:var(--surface-2,rgba(128,128,128,.12))}
  .casemenu-list a[data-current="1"]{font-weight:600}
  .casemenu-list .when{margin-left:auto;color:var(--text-muted);font-size:11px}
  .casemenu-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .casemenu-row input[type=text]{flex:1;min-width:0}
  .casemenu-panel textarea{width:100%;font-family:var(--mono,ui-monospace,monospace);
    font-size:11px;resize:vertical}
  .casemenu-note{font-size:11px;color:var(--text-muted);margin:8px 0 0}
  .casemenu-note[data-tone="bad"]{color:var(--bad,#c0392b)}
  .casemenu-note[data-tone="good"]{color:var(--good,#1e8449)}
  .spacer{flex:1}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;
    border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border)}
  .badge[data-stage="idle"]{color:var(--text-secondary)}
  .badge[data-stage="meshing"],.badge[data-stage="solving"],
  .badge[data-stage="exporting"]{color:var(--series-1)}
  .badge[data-stage="done"]{color:var(--good)}
  .badge[data-stage="failed"]{color:var(--critical)}
  button{font:inherit;font-size:13px;padding:6px 13px;border-radius:8px;cursor:pointer;
    border:1px solid var(--border);background:transparent;color:var(--text-secondary)}
  button:hover:not(:disabled){color:var(--text-primary)}
  button:disabled{opacity:.45;cursor:default}
  .linkbutton{font-size:13px;padding:6px 13px;border-radius:8px;text-decoration:none;
    border:1px solid var(--border);color:var(--text-secondary)}
  .linkbutton:hover{color:var(--text-primary)}
  .linkbutton[aria-disabled="true"]{opacity:.45;pointer-events:none}
  button.primary{background:var(--series-1);border-color:transparent;color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){color:#fff;filter:brightness(1.08)}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;
    align-items:start}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    overflow:hidden}
  .card-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding:12px 16px;border-bottom:1px solid var(--border)}
  .card-title{font-weight:600}
  .card-sub{color:var(--text-muted);font-size:12.5px}
  .column{display:flex;flex-direction:column;gap:16px;min-width:0}

  /* --- drawings --- */
  /* Layout, head, zoom and scroller live in drawing.css, shared with the
     results page so the same lines are read at the same size on both. */
  .view{background:var(--paper)}
  /* --- the components a case uses, in the group that uses them --- */
  .components{display:flex;flex-direction:column;gap:1px;margin:2px 0 10px;
    background:var(--grid)}
  .component-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;
    align-items:center;padding:6px 0;background:var(--surface)}
  .component-role{font-size:12px;color:var(--text-secondary)}
  .component-row select,.component-name{font:inherit;font-size:12px;
    justify-self:end;max-width:190px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .component-row select{padding:2px 6px;border-radius:6px;background:var(--page);
    color:var(--text-primary);border:1px solid var(--border)}
  .component-name{color:var(--text-primary)}
  .component-cost{grid-column:1/-1;font-size:11px;color:var(--text-muted);
    font-variant-numeric:tabular-nums}
  .component-tag{grid-column:2;justify-self:end;font-size:10px;
    color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
  .component-tag.pending{color:var(--warning)}
  /* A unit that does not suit this room is offered and says why, rather than
     being hidden from the reader who came looking for it (ADR-092). */
  .component-cost[data-tone="bad"]{color:var(--warning)}
  .notes.alerts .mark{color:var(--critical, #d03b3b)}

  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 16px 12px;
    color:var(--text-secondary);font-size:12px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}

  /* --- form --- */
  .params{padding:2px 16px 14px}
  .param-group{padding:10px 0 4px;border-bottom:1px solid var(--border)}
  .param-group:last-child{border-bottom:none}
  .param-group-head{display:flex;justify-content:space-between;align-items:baseline;
    flex-wrap:wrap;gap:4px 10px;font-size:12px;font-weight:650;letter-spacing:.02em;
    text-transform:uppercase;color:var(--text-primary);margin-bottom:6px}
  .param-group-head .group-title{flex:0 1 auto;white-space:nowrap}
  /* the note only: a bare `span` rule here also caught the title, which then
     lost the uppercase the rest of the headers have */
  .param-group-head .group-note{font-size:11.5px;font-weight:400;
    text-transform:none;letter-spacing:0;color:var(--text-muted);text-align:right}
  .param-group-head .group-link{flex:none;font-size:11px;font-weight:600;
    text-transform:none;letter-spacing:0;color:var(--series-1);
    text-decoration:none;white-space:nowrap}
  .param-group-head .group-link:hover{text-decoration:underline}
  .param{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;
    padding:5px 0}
  .param label{color:var(--text-secondary);font-size:12.5px}
  .param .unit{color:var(--text-muted);font-size:11px}
  input[type="number"]{width:100%;padding:5px 7px;border-radius:7px;font:inherit;
    font-size:12.5px;background:var(--page);color:var(--text-primary);
    border:1px solid var(--border);font-variant-numeric:tabular-nums}
  input[type="checkbox"]{width:16px;height:16px;accent-color:var(--series-1)}
  .param-wide{grid-template-columns:1fr;padding-top:0}
  .param-wide select{width:100%;font:inherit;font-size:12.5px;padding:5px 7px;
    border-radius:7px;background:var(--page);color:var(--text-primary);
    border:1px solid var(--border)}
  .param-note{margin:2px 0 6px;font-size:11.5px;color:var(--text-muted);
    font-variant-numeric:tabular-nums}
  .actions{display:flex;gap:8px;padding:0 16px 14px}

  .balance{display:flex;flex-wrap:wrap;gap:6px 26px;padding:12px 16px;
    border-bottom:1px solid var(--border)}
  .balance-item{display:flex;flex-direction:column;gap:1px}
  .balance-item b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
  .balance-item i{font-style:normal;font-size:11.5px;color:var(--text-muted)}
  .balance-item[data-state="good"] b{color:var(--good)}
  .balance-item[data-state="warn"] b{color:var(--warning)}

  table.sensors{width:100%;border-collapse:collapse;font-size:12.5px}
  table.sensors th,table.sensors td{padding:7px 16px;text-align:right}
  table.sensors th:first-child,table.sensors td:first-child{text-align:left}
  table.sensors thead th{color:var(--text-muted);font-weight:500;font-size:11.5px;
    border-bottom:1px solid var(--border)}
  table.sensors tbody td{font-variant-numeric:tabular-nums;
    border-bottom:1px solid var(--grid)}
  table.sensors tbody tr:last-child td{border-bottom:none}
  table.sensors .muted{color:var(--text-muted)}
  .sensor-label{display:block}
  .sensor-note{display:block;color:var(--text-muted);font-size:11px}
  .sensor-chart{display:block;width:100%;height:auto;padding:8px 8px 0}
  .sensor-foot{margin:0;padding:10px 16px 0;color:var(--text-muted);font-size:11.5px}
  .empty{margin:0;padding:18px 16px;color:var(--text-muted);font-size:12.5px;
    text-align:center}

  .fact{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;
    padding:8px 16px;border-bottom:1px solid var(--grid)}
  .fact:last-child{border-bottom:none}
  .fact-label{color:var(--text-secondary);font-size:12.5px}
  .fact-a,.fact-b{text-align:right;font-variant-numeric:tabular-nums}
  .fact-a{font-size:12.5px}
  .fact-b{grid-column:2;color:var(--text-muted);font-size:11.5px}

  .notes{list-style:none;margin:0;padding:6px 0 12px}
  .notes li{display:grid;grid-template-columns:16px 1fr;gap:9px;padding:6px 16px;
    color:var(--text-secondary);font-size:12.5px}
  .notes .mark{color:var(--warning);font-weight:700}
  .notes.bad .mark{color:var(--critical)}

  #progress{position:relative;height:220px;padding:4px 8px 0}
  .chart-grid{stroke:var(--grid);stroke-width:1}
  /* The range the air at a station spans, behind its mixing-cup line. Kept
     faint: it is context for the line, not a series of its own (ADR-078). */
  .chart-band{opacity:.10;stroke:none}
  .chart-axis{stroke:var(--axis);stroke-width:1}
  .chart-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .chart-tick{fill:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums}
  /* A direct label is a mark in the series colour and its name in ink. The
     mark carries the identity, so the chart still reads in print and to a
     reader who cannot separate the hues (ADR-053). */
  .chart-leader{fill:none;stroke-width:1;opacity:.5}
  .chart-empty{fill:var(--text-muted);font-size:12.5px;text-anchor:middle}

  .error{margin:28px auto;max-width:620px;padding:18px;border:1px solid var(--border);
    border-radius:12px;background:var(--surface)}
  @media (max-width:900px){
    .layout{grid-template-columns:minmax(0,1fr)}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">AICFD</span>
  <details class="casemenu" id="case-menu">
    <summary><span class="case" id="case-name">loading…</span></summary>
    <div class="casemenu-panel">
      <div class="casemenu-head">Open a case</div>
      <div id="case-list" class="casemenu-list"></div>
      <div class="casemenu-head">Start one</div>
      <div class="casemenu-row">
        <input id="case-new-name" type="text" placeholder="name, e.g. hall-sp07" />
        <select id="case-new-from"><option value="">from the starter</option></select>
        <button id="case-new" type="button">Create</button>
      </div>
      <div class="casemenu-head">Paste one in</div>
      <div class="casemenu-row">
        <input id="case-import-name" type="text" placeholder="name for it" />
        <button id="case-import" type="button">Import</button>
        <span class="spacer"></span>
        <button id="case-copy" type="button">Copy this case</button>
      </div>
      <textarea id="case-import-yaml" rows="6"
        placeholder="paste the case YAML here"></textarea>
      <p class="casemenu-note" id="case-status">A case is written only once the
        generator has built it, so a paste that cannot be drawn is refused here
        rather than saved and discovered on the next reload.</p>
    </div>
  </details>
  <span class="badge" id="stage" data-stage="idle">—</span>
  <span class="spacer"></span>
  <button id="theme-toggle" type="button">Dark</button>
</header>
<div id="root"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
