<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 21h18M7 16h13M7 11h8' stroke='white' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<title>AICFD</title>
<link rel="stylesheet" href="./drawing.css" />
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
    --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
    --series-4:#eda100; --series-5:#e87ba4; --series-6:#008300;
    --series-7:#4a3aa7; --series-8:#e34948;
    --cold:#2a78d6; --hot:#d03b3b; --containment:#1baf7a;
    --solid:#6f6e6a; --rack:#d8d8d4; --paper:#ffffff;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19;
    --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --series-4:#c98500; --series-5:#d55181; --series-6:#008300;
    --series-7:#9085e9; --series-8:#e66767;
    --cold:#3987e5; --hot:#e66767; --containment:#199e70;
    --solid:#8e8d88; --rack:#2e2e2b; --paper:#141413;
  }}
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19;
    --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --series-4:#c98500; --series-5:#d55181; --series-6:#008300;
    --series-7:#9085e9; --series-8:#e66767;
    --cold:#3987e5; --hot:#e66767; --containment:#199e70;
    --solid:#8e8d88; --rack:#2e2e2b; --paper:#141413;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text-primary);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
  .brand{font-weight:650;letter-spacing:-.01em}
  .topbar .case{color:var(--text-secondary)}
  .spacer{flex:1}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;
    border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border)}
  .badge[data-stage="idle"]{color:var(--text-secondary)}
  .badge[data-stage="meshing"],.badge[data-stage="solving"]{color:var(--series-1)}
  .badge[data-stage="done"]{color:var(--good)}
  .badge[data-stage="failed"]{color:var(--critical)}
  button{font:inherit;font-size:13px;padding:6px 13px;border-radius:8px;cursor:pointer;
    border:1px solid var(--border);background:transparent;color:var(--text-secondary)}
  button:hover:not(:disabled){color:var(--text-primary)}
  button:disabled{opacity:.45;cursor:default}
  .linkbutton{font-size:13px;padding:6px 13px;border-radius:8px;text-decoration:none;
    border:1px solid var(--border);color:var(--text-secondary)}
  .linkbutton:hover{color:var(--text-primary)}
  button.primary{background:var(--series-1);border-color:transparent;color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){color:#fff;filter:brightness(1.08)}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;
    align-items:start}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    overflow:hidden}
  .card-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding:12px 16px;border-bottom:1px solid var(--border)}
  .card-title{font-weight:600}
  .card-sub{color:var(--text-muted);font-size:12.5px}
  .column{display:flex;flex-direction:column;gap:16px;min-width:0}

  /* --- drawings --- */
  /* the transverse section is 4.2 m wide and the longitudinal one 9 m: equal
     columns would shrink both to the narrow one's scale */
  .views{display:grid;grid-template-columns:minmax(0,.58fr) minmax(0,1fr);
    gap:1px;background:var(--border)}
  .view{background:var(--paper);padding:10px 12px 4px;display:flex;flex-direction:column;align-items:center}
  .view h3,.view p{align-self:flex-start}
  .view:last-child{grid-column:1/-1}
  .view h3{margin:0;font-size:12.5px;font-weight:650;color:var(--text-primary)}
  .view p{margin:1px 0 4px;font-size:11.5px;color:var(--text-muted)}
  .view svg{display:block;max-width:100%;height:auto}

  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 16px 12px;
    color:var(--text-secondary);font-size:12px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}

  /* --- form --- */
  .params{padding:6px 16px 14px}
  .param{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;
    padding:5px 0}
  .param label{color:var(--text-secondary);font-size:12.5px}
  .param .unit{color:var(--text-muted);font-size:11px}
  input[type="number"]{width:100%;padding:5px 7px;border-radius:7px;font:inherit;
    font-size:12.5px;background:var(--page);color:var(--text-primary);
    border:1px solid var(--border);font-variant-numeric:tabular-nums}
  input[type="checkbox"]{width:16px;height:16px;accent-color:var(--series-1)}
  .actions{display:flex;gap:8px;padding:0 16px 14px}

  .balance{display:flex;flex-wrap:wrap;gap:6px 26px;padding:12px 16px;
    border-bottom:1px solid var(--border)}
  .balance-item{display:flex;flex-direction:column;gap:1px}
  .balance-item b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
  .balance-item i{font-style:normal;font-size:11.5px;color:var(--text-muted)}
  .balance-item[data-state="good"] b{color:var(--good)}
  .balance-item[data-state="warn"] b{color:var(--warning)}

  table.sensors{width:100%;border-collapse:collapse;font-size:12.5px}
  table.sensors th,table.sensors td{padding:7px 16px;text-align:right}
  table.sensors th:first-child,table.sensors td:first-child{text-align:left}
  table.sensors thead th{color:var(--text-muted);font-weight:500;font-size:11.5px;
    border-bottom:1px solid var(--border)}
  table.sensors tbody td{font-variant-numeric:tabular-nums;
    border-bottom:1px solid var(--grid)}
  table.sensors tbody tr:last-child td{border-bottom:none}
  table.sensors .muted{color:var(--text-muted)}
  .sensor-label{display:block}
  .sensor-note{display:block;color:var(--text-muted);font-size:11px}
  .sensor-chart{display:block;width:100%;height:auto;padding:8px 8px 0}
  .sensor-foot{margin:0;padding:10px 16px 0;color:var(--text-muted);font-size:11.5px}
  .empty{margin:0;padding:18px 16px;color:var(--text-muted);font-size:12.5px;
    text-align:center}

  .fact{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;
    padding:8px 16px;border-bottom:1px solid var(--grid)}
  .fact:last-child{border-bottom:none}
  .fact-label{color:var(--text-secondary);font-size:12.5px}
  .fact-a,.fact-b{text-align:right;font-variant-numeric:tabular-nums}
  .fact-a{font-size:12.5px}
  .fact-b{grid-column:2;color:var(--text-muted);font-size:11.5px}

  .notes{list-style:none;margin:0;padding:6px 0 12px}
  .notes li{display:grid;grid-template-columns:16px 1fr;gap:9px;padding:6px 16px;
    color:var(--text-secondary);font-size:12.5px}
  .notes .mark{color:var(--warning);font-weight:700}
  .notes.bad .mark{color:var(--critical)}

  #progress{position:relative;height:220px;padding:4px 8px 0}
  .chart-grid{stroke:var(--grid);stroke-width:1}
  .chart-axis{stroke:var(--axis);stroke-width:1}
  .chart-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .chart-tick{fill:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums}
  .chart-empty{fill:var(--text-muted);font-size:12.5px;text-anchor:middle}

  .error{margin:28px auto;max-width:620px;padding:18px;border:1px solid var(--border);
    border-radius:12px;background:var(--surface)}
  @media (max-width:900px){
    .layout{grid-template-columns:minmax(0,1fr)}
    .views{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">AICFD</span>
  <span class="case" id="case-name">carregando…</span>
  <span class="badge" id="stage" data-stage="idle">—</span>
  <span class="spacer"></span>
  <button id="theme-toggle" type="button">Escuro</button>
</header>
<div id="root"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
