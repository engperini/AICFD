id: sum3-low-density-network
name: SUM3 low-density storage and network rack
cooling: air

# The same envelope as the low-density compute cabinet, at a lower duty. Kept
# apart from it because a row is counted in both -- 22 IT tiles and 2 network
# tiles -- and quoting one rack's range for the other misses by 20 kW.
size: [1.200, 1.800, 2.600]
load_kw: 34.0
source: >
  Colocation and Data Center Lease (2025), Exhibit A-2, SUM3, signed.
  1.5.4.1 Rack Dimensions: maximum low density rack 1200mm (W) x 1800mm (D) x
  2600mm (H). 1.4.14.1: low density storage and network racks range from 14 kW
  to 34 kW. 1.1.3.1: low density rows are provided with infrastructure for
  100% air cooling.
note: >
  34 kW is the TOP of the 14-34 kW range. It is also the BOTTOM of the low
  density compute range, which is the one number where the two cabinets meet
  -- read the type name, not the figure, when telling them apart.
