id: generic-600-1200-45u
name: 600 x 1200, 45U air-cooled cabinet
cooling: air

# The volume cabinet of this specification: 45U in a 600 mm bay, 1200 mm deep,
# 2200 mm tall over its casters. Both the Type-E requirement and the Vinhedo 03
# layout state it in these words, and it is the type most of the air-cooled
# positions in that hall are.
size: [0.600, 1.200, 2.200]
u_height: 45
height_note: 2200 mm with caster
load_kw: 12.0
source: >
  Type-E Customer Colocation Facility Technical Requirement (Liquid Cooling)
  RFP v2.0, overall aisle layout design: air-cooled racks 600*1200*45U (2200mm
  with caster), 12~16 kW per rack. The same cabinet appears in the Vinhedo 03
  15+15 MW layout as the NH 12 kW and NH 10 kW network racks and the NH-ODF
  rack.
note: >
  12 kW is the lower end of the range the RFP gives for this cabinet; it runs
  to 16. A case that racks it harder should say so per position rather than
  edit this file, which is the type and not the project.
