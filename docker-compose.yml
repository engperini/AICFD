services:
  aicfd:
    build: .
    image: aicfd:latest
    ports:
      - "8000:8000"
    # Which case the MODEL page opens on. It has to be named here: that page
    # asks the server for its model, and the server fixes the case when it
    # starts -- `?case=` in the URL is read only by the results page, which is
    # static and resolves it against results/ itself.
    #
    # Without this, `aicfd view` falls back to the newest spec by modification
    # time, and on a fresh clone that is whatever order the checkout happened
    # to write the files in: `docker compose up` would open one case on one
    # machine and another on the next.
    command: python3 -m aicfd view --case hall-double-gallery --port 8000 --no-browser
    volumes:
      # The clone IS the application. The image carries the slow, rarely
      # changing half -- OpenFOAM and the Python dependencies -- and everything
      # that moves comes from the working copy, so `git pull && docker compose
      # up` shows the new code with no rebuild (ADR-034).
      #
      # Without this the page and the CLI are baked into the image, and a pull
      # followed by `docker compose up` silently serves the old ones: the
      # failure looks like the fix not working rather than like a stale image,
      # which is the worst way for it to look.
      - ./aicfd:/app/aicfd
      - ./web:/app/web
      - ./tests:/app/tests
      - ./cases:/app/cases
      - ./runs:/app/runs
      - ./results:/app/results
      # The unit library, and the documents made from a result. Both are
      # written by the pages -- the equipment page saves a curve, the results
      # page writes a .docx -- and without these the writes land inside the
      # container, where they survive neither `docker compose down` nor a
      # rebuild. Editing a fan wall curve and finding it gone tomorrow reads
      # as the page not saving rather than as a missing mount.
      - ./equipment:/app/equipment
      - ./reports:/app/reports
      # Read-only: the three worked results are evidence, and nothing in the
      # container has any business writing over them (ADR-032).
      - ./reference:/app/reference:ro
