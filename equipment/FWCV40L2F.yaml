# Uniflair Front Flow Chilled Water FWCV40L2F — fan wall unit.
#
# ONE manufacturer selection, which is all a unit needs: the coil is recovered
# from it and answers at any return air the room really produces (ADR-063).
# Validating that extrapolation is the engineer's, and the report says so.
#
# Selection sheet: 36.5 °C dry bulb / 22.3 °C wet bulb / 30% RH entering air,
# 661 m, 150 Pa ESP, 20/30 °C water at 43,494 l/h, 12 Type B fans at 93%
# speed, China plant selection, 460/3ph/60Hz, standard tolerance.
#
# The cleanest sheet in this library: three independent checks, all under
# 0.1%. The air side (134,500 m3/h from 36.5 to 24.6 °C at 661 m) gives 470.7
# kW against the stated NET 470.3. The water side (43,494 l/h over a 10 K
# rise) gives 505.0 against the stated GROSS 505.4 (ADR-069). And gross less
# the 35.1 kW of fan power is the net exactly (ADR-068).
#
# Its "Discharge air temperature off unit" is the unit's discharge, as the
# wording says and as the air side closing on the NET figure confirms -- not
# every manufacturer means that by "supply air" (ADR-070).
model: FWCV40L2F
family: Uniflair Front Flow Chilled Water

# Width x depth x height, metres. From the general arrangement table, which
# covers FWCV40L2A rather than this L2F -- CONFIRM the two share an envelope.
# A = 4000 width, F = 1636 depth. Of its three heights the overall is B: on
# the single-height L1A the same table gives B 2250 / C 2150 / D 2000, and the
# D of this L2A, 4000 mm, is what the FWCV36 sheet calls its "Coil vane
# Height". The casing is what a gallery has to fit, so B is carried here.
size: [4.00, 1.636, 4.25]
weight_kg: 4400               # dry; 4566 kg operating, with the coil full

fans:
  count: 12
  type: Type B Fan
  modulation: 93              # % of full speed, at the selection point

selection:
  # The conditions this selection was taken at. Change any of them and the
  # numbers below are not this unit's: ask for a new selection.
  elevation_m: 661
  esp_pa: 150                 # external static pressure (unit max: 269 Pa)
  entering_water_c: 20
  leaving_water_c: 30
  entering_air_rh: 30         # %
  water_flow_lh: 43494        # 12.08 l/s, stated (ADR-069)

design:
  # THE selection. One machine at one duty -- the one this plant was bought
  # on -- and the anchor for everything the software computes.
  return_c: 36.5              # air the unit RECEIVES, dry bulb
  supply_c: 24.6              # discharge air off the unit, dry bulb (62% RH)
  airflow_m3h: 134500         # unit return airflow, actual air at 661 m
  nscc_kw: 470.3              # NET sensible: 505.4 gross less 35.1 of fan power
  power_kw: 35.1              # room unit absorbed power (52.5 A)

curve:
  # Representative, not the manufacturer's: the sheet gives the one point the
  # unit was selected to overcome, and the rest has the shape of an EC array.
  # Anchored on the sheet's 269 Pa MAXIMUM external static pressure at the
  # rated flow; the selection itself runs at 150 Pa with the fans at 93%, so
  # this curve is the full-speed envelope and that is what the uncontrolled
  # operating point needs. Replace with the real P-Q curve when it is given,
  # and tick `measured` on the page.
  measured: false
  points:
    - [0, 650]
    - [67000, 520]
    - [134500, 269]
    - [160000, 130]
    - [182000, 0]
