# Fan-wall POD with a SUPPLY PLENUM, hot-aisle containment and a ceiling
# plenum return.
#
# The air loop:
#   fan wall -> supply plenum -> grille in the hall wall -> cold aisle ->
#   racks -> contained hot aisle -> ceiling grilles -> return plenum ->
#   opening above the dividing wall -> over the plenum lid -> gallery ->
#   fan wall
#
# This is `pod-fanwall` with one thing changed: the wall between the hall and
# the mechanical gallery is a DOUBLE wall, 1,2 m between its two leaves, and
# the inner leaf carries a supply grille in front of the cold aisle. The unit
# and the opening it sits in do not move -- it now blows into the cavity
# rather than into the aisle, the cavity pressurises, and the grille decides
# where the air leaves and in which direction.
#
# The hall is 1,2 m longer than `pod-fanwall` for it. The plenum is added to
# the building, not taken out of the room: `racks.offset_x` is the clearance
# to the wall the hall actually has, and that wall is now the inner leaf
# (ADR-058).
name: pod-plenum

site:
  altitude_m: 0               # sea level; the air weighs what it weighs here

gallery:
  depth: 3.0                  # mechanical gallery, no false ceiling, full height

hall:
  size: [6.0, 4.2, 8.0]       # length x, width y, floor to slab z
  ceiling: 6.5                # false ceiling; above it, the return plenum

aisles:
  cold: 1.8
  hot: 1.2                    # contained: a chimney from the racks to the ceiling

racks:
  count: 3
  load_kw: 6.0
  size: [0.6, 1.2, 2.2]       # front(x) x depth(y) x height(z)
  offset_x: 2.0               # from the gallery wall
  airflow_cfm_per_kw: 158     # what a rack draws per kW; sizes its resistance

fanwall:
  airflow_m3h: 5000           # PER UNIT, as a datasheet gives it
  supply_temp_c: 20.0
  height: 4.0
  width: 1.8                  # across the cold aisle
  static_pressure_pa: 100     # external static pressure from the datasheet,
                              # at the rated airflow
  # P-Q curve of the unit (m3/h, Pa). The 5000 @ 100 point is the datasheet's;
  # the rest has the shape of an EC fan array (an almost quadratic fall to free
  # delivery). REPLACE with the curve from your datasheet -- it decides the
  # uncontrolled operating point and how much margin the control has.
  curve:
    - [0, 250]
    - [2500, 200]
    - [5000, 100]
    - [6500, 40]
    - [7500, 0]

grilles:
  size: 0.60                  # 3 square grilles, side by side, over the racks
  count: 3
  # Ceiling return grille, from a catalogue datasheet (Koolair series 20.2,
  # ceiling-mounted return): 4.1 Pa at 2.1 m/s core velocity (Vk), ceiling
  # mounting factor 0.81, about 80% free area. Referred to the face velocity
  # over the gross area (what the model uses): v = 2.1 x 0.80 = 1.68 m/s, so
  # K = 2 x 4.1 / (1.2 x 1.68^2) = 2.4.
  # loss_coefficient wins over free_area when both are present; without it, K
  # comes from the free area by Idelchik's thin plate (which under-reads a
  # vaned grille -- it would give 0.54 here).
  free_area: 0.80
  loss_coefficient: 2.4

containment:
  enabled: true

mesh:
  # Cell edge per axis (x, y, z). 0.20 m in plan resolves a 0.60 m rack; in z
  # it is 0.10 m so the false ceiling (6.5 m) and the rack tops (2.2 m) land on
  # cell faces. 75,600 cells: four times fewer than a uniform 0.10 m mesh, and
  # the coarse-against-fine comparison agreed within 0.2 K and 3%
  # (docs/experiments).
  cell_size: [0.20, 0.20, 0.10]

solver:
  max_iterations: 2000        # a cap, not a target: residualControl should stop
                              # the run first
  residual_tolerance: 1.0e-4
  sensor_interval: 100        # how often the instrumented places report
  warm_start: true            # seed the field with the loop's topology.
                              # false starts from a uniform field -- both have
                              # to reach the same answer (ADR-019)
  processors: 1               # above 1: decomposePar + mpirun

plenum:
  enabled: true               # the hall wall doubled, the cavity pressurised
  depth: 1.2                  # between the two leaves of that wall
  grille:
    width: 2.0                # one grille per cold aisle, this wide
    # height defaults to the rack height: air let in above the racks is air
    # the racks never breathe.
  # closed: [supply1]         # shut a grille to send its air to the others
