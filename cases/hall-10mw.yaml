# Conceptual 10 MW data hall: PODs of row + contained hot aisle + row,
# repeated, with a wall of Vertiv CA40 units along the mechanical gallery,
# sized by capacity and by airflow (158 CFM/kW).
#
# Coarse conceptual-design mesh: one rack is one cell in plan, nine cells tall.
#
# The air loop, the POD's own, N times over:
#   fan walls -> cold aisles -> racks -> contained hot aisles -> ceiling
#   grilles -> plenum -> opening above the dividing wall -> gallery -> fan walls
#
# The run this case comes from is written up in
# docs/experiments/2026-09-18-hall-10mw.md.
name: hall-10mw

gallery:
  depth: 3.0                  # mechanical gallery for the fan walls, no ceiling

hall:
  height: 8.0                 # floor to slab
  ceiling: 6.5                # false ceiling; above it, the return plenum
  # Length and width are derived from the layout: perimeter + row + perimeter
  # along x; perimeter + N x (row + hot aisle + row) + cold aisles along y.

pods: 16                      # each POD = row + contained hot aisle + row
                              # 16 x 48 racks x 13 kW = 9.98 MW

aisles:
  cold: 1.8                   # between PODs; the fan walls face these
  hot: 1.2                    # contained, a chimney up to the false ceiling
  perimeter: 1.8              # clearance round every row (>= 1.8)

racks:
  per_row: 24
  load_kw: 13.0
  size: [0.6, 1.2, 2.2]       # width x depth x height; the height snaps to
                              # 2.25 m on the 0.25 m mesh (the model warns)
  airflow_cfm_per_kw: 158     # design reference: what a rack draws per kW

site:
  altitude_m: 1880            # the fan wall datasheet was selected at 1,880 m:
                              # 76,650 m3/h of actual air = 56,475 m3/h of
                              # standard air. The solver runs at the site's
                              # pressure (80.7 kPa), so airflow and mass agree
                              # with the selection.

fanwall:
  # Vertiv CWA CA40NPVG6, Ascenty QR2 selection (37 C / 30% RH return, 18/28 C
  # water, 100 Pa ESP). Everything below is from that datasheet, per unit.
  count: 35                   # 35 x 290.9 kW = 10,182 kW >= 9,984 kW of IT;
                              # 35 x 76,650 = 2.68 M m3/h >= the 2.68 M m3/h
                              # the racks draw at 158 CFM/kW. 34 fails both.
  width: 2.23                 # snaps to 2.10 m on the 0.30 m mesh (warned)
  height: 3.67                # snaps to 3.75 m on the 0.25 m mesh (warned)
  airflow_m3h: 76650          # actual air at the site's altitude
  capacity_kw: 290.9          # NSCC (net sensible cooling capacity)
  power_kw: 16.9              # electrical power input
  supply_temp_c: 22.1         # supply air from the selection
  static_pressure_pa: 100     # ESP
  curve:                      # representative, anchored on the selection
    - [0, 250]                # point; replace with the unit's P-Q curve
    - [38000, 200]
    - [76650, 100]
    - [100000, 40]
    - [115000, 0]

grilles:
  size: 0.60
  coverage: 1.0               # the whole ceiling over each hot aisle is grille
  free_area: 0.80
  loss_coefficient: 2.4       # Koolair series 20.2, see cases/pod-fanwall.yaml

containment:
  enabled: true

mesh:
  # x 0.60: one rack per cell along the row; y 0.30: a 1.2 m rack, the 1.2 and
  # 1.8 m aisles and the fan wall all land on cell faces; z 0.25: ceiling
  # (6.5), fan wall (3.75) and slab (8.0) aligned, nine cells per rack so the
  # top reads separately from the base. 35 x 294 x 32 = 329,280 cells.
  cell_size: [0.60, 0.30, 0.25]

solver:
  max_iterations: 3000
  residual_tolerance: 1.0e-4
  sensor_interval: 100
  warm_start: true
  processors: 4               # decomposePar + mpirun; 1 runs serially
