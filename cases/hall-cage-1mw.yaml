# DATA HALL WITH A CUSTOMER CAGE AT ONE END -- 1 MW, direct expansion,
# downflow CRACs on a raised floor.
#
# What this case is here to show, and what makes it different from the other
# halls in this folder:
#
#   A CAGE. One customer's rows are fenced off from the rest of the room. The
#   cage here is at the EDGE of the hall: it occupies pods 1 and 2, the room
#   closes it on three sides, and its only real wall is the one dividing it
#   from the racks above. Leave `cage.sides` out and every side the room does
#   not already close is built instead, which is a cage standing free in the
#   middle (ADR-096, ADR-098).
#
#   A REAL RACK SCHEDULE INSIDE IT. 509,96 kW over 52 positions, cabinet by
#   cabinet, as the customer's drawing lays them out: 20 kW cabinets at the
#   ends of each row, 10 kW through the middle, five ODF positions carrying
#   nothing at all, and twelve future positions at 8,33 kW. Outside the cage
#   the remaining 488,8 kW is spread evenly over 104 positions at 4,7 kW --
#   which is how a colocation hall really is, and what a single
#   `racks.load_kw` cannot say.
#
#   A DIRECT-EXPANSION PLANT, MODELLED. The units are DX room units, not
#   chilled-water fan walls, and their evaporator is fitted from the
#   manufacturer's own selection (ADR-103): the run asks each machine what it
#   does at the return this room gives it rather than holding it at the plate
#   figure. What is still not modelled is the condensing side, which follows
#   the outdoor air -- the report says so once, in its limitations.
#
#   A CONTAINED COLD AISLE, AND A CAGE WALL STANDING IN ONE. The aisle
#   between rows F4 and F5 is the one the dividing wall crosses, so the
#   containment does not reach it: each side closes with a side of its own
#   and the rest of the clearance is the walkway to the cage (ADR-110).
#
# The geometry is taken from a real colocation layout and the room is real in
# its proportions. The cage's loads are the project's own schedule with the
# client's names taken off.
#
# The air loop: downflow units -> under-floor plenum -> floor plates in the
# contained cold aisles -> racks -> the room, which is the hot side ->
# ceiling grilles over the hot aisles -> return plenum -> back to the units.
name: hall-cage-1mw

site:
  altitude_m: 0.0             # sea level, which is the conservative choice
                              # for air density: the denser the air, the more
                              # the plant does. A real site states its own.

gallery:
  depth: 4.4                  # the service space behind the units at each
                              # row end: 4,77 and 4,56 m on the layout this
                              # is drawn from, modelled symmetric at 4,4 m so
                              # it lands on the 0,40 m x cell.
  sides: 2                    # service space at both row ends

hall:
  height: 5.6                 # floor to slab. The raised floor below is ADDED
                              # to this, so the building is 6,6 m tall.
  ceiling: 4.0                # false ceiling, with the return plenum above
                              # it. Both of these move every velocity in the
                              # result, so on a real study they come off the
                              # section rather than off a case like this one.

pods: 6                       # 6 x (row + contained hot aisle + row). Every
                              # aisle here is 1,20 m, so the pod pitch is
                              # 4,80 m; six of them, the wider aisle the cage
                              # wall stands in and the perimeter make a 34,8 m
                              # room. The cage is pods 1 and 2, rows F1 to F4.

aisles:
  cold: 1.8                   # measured: B to C, 6,58 -> 7,78 m
  hot: 1.2                    # measured: the hatched HAC bands, 1,199 m
  perimeter: 1.2              # rack face to HALL wall. It is the outermost
                              # cold aisle as well as the clearance, and at
                              # 1,20 m it is the same aisle as every other one
                              # in the room. Measured 1,18 m inside the cage on
                              # the row-A side. It lands on the 0,20 m cell, so
                              # nothing here is snapped.
                              # Modelled symmetric; on the row-D side the real
                              # hall runs further, to the row positions that
                              # are not in this model.
                              # Where a cage side is really built, this has to
                              # exceed `cage.clearance`, or the cage wall IS
                              # the hall wall and the build refuses it by name.

racks:
  per_row: 13                 # 13 x 800 mm = 10,4 m of row. The cage's rows
                              # are 13 positions on the customer's schedule:
                              # ten fitted and three held for future cabinets.
                              # Every row of the hall is the same length.
  load_kw: 4.7                # OUTSIDE THE CAGE, spread evenly: 104 positions
                              # in pods 3 to 6. 104 x 4,7 = 488,8 kW, which
                              # with the cage's 509,96 makes 998,76 kW -- the
                              # room's 1 MW to within the rounding of a
                              # per-cabinet figure. A real study states the
                              # distribution it has.
  size: [0.8, 1.2, 2.2]       # 800 mm wide, 1,20 m deep, 2,2 m tall.
  airflow_cfm_per_kw: 158     # the design reference (ADR-023). A rack
                              # datasheet beats it where there is one.

  # THE CAGE, POSITION BY POSITION, from the customer's rack schedule. Rows A,
  # B, C and D on that drawing are F1 to F4 here -- pod 1 is A and B facing
  # across their hot aisle, pod 2 is C and D.
  #
  #   410,00 kW  the cabinets the schedule marks and colours, 20 kW and 10 kW
  #     99,96 kW  twelve future positions (11, 12, 13 of each row) at 8,33 kW
  #   ---------
  #   509,96 kW  which is the 510 kW the cage is let at, to four hundredths
  #
  # The ODF positions carry NO load: an optical distribution frame is a
  # cabinet full of fibre. It is still in the model as a cabinet, because it
  # still stands in the row and the air still has to get round it.
  loads:
    # A on the schedule: A01 at 20 kW, A02-A08 at 10, A09 at 20, A10 an ODF.
    F1-01: 20
    F1-02: 10
    F1-03: 10
    F1-04: 10
    F1-05: 10
    F1-06: 10
    F1-07: 10
    F1-08: 10
    F1-09: 20
    F1-10: 0  # ODF: a cabinet that breathes and makes no heat
    F1-11: 8.33
    F1-12: 8.33
    F1-13: 8.33

    # B: B01 at 20, B02-B07 at 10, B08 at 20, B09 and B10 ODFs.
    F2-01: 20
    F2-02: 10
    F2-03: 10
    F2-04: 10
    F2-05: 10
    F2-06: 10
    F2-07: 10
    F2-08: 20
    F2-09: 0  # ODF: a cabinet that breathes and makes no heat
    F2-10: 0  # ODF: a cabinet that breathes and makes no heat
    F2-11: 8.33
    F2-12: 8.33
    F2-13: 8.33

    # C: C01 at 20, C02-C08 at 10, C09 and C10 ODFs.
    F3-01: 20
    F3-02: 10
    F3-03: 10
    F3-04: 10
    F3-05: 10
    F3-06: 10
    F3-07: 10
    F3-08: 10
    F3-09: 0  # ODF: a cabinet that breathes and makes no heat
    F3-10: 0  # ODF: a cabinet that breathes and makes no heat
    F3-11: 8.33
    F3-12: 8.33
    F3-13: 8.33

    # D: D01-D09 at 10, D10 at 20.
    F4-01: 10
    F4-02: 10
    F4-03: 10
    F4-04: 10
    F4-05: 10
    F4-06: 10
    F4-07: 10
    F4-08: 10
    F4-09: 10
    F4-10: 20
    F4-11: 8.33
    F4-12: 8.33
    F4-13: 8.33

cage:
  # AT THE EDGE OF THE HALL, which is what the plan shows: the cage occupies
  # the bottom of the data hall and the room closes it on three sides. Only
  # ONE wall is really a cage wall -- the one dividing it from the rest of the
  # DH -- and it spans the full width of the room (ADR-098).
  enabled: true
  pods: [1, 2]                # rows F1 to F4: the two pods the cage holds
  sides: [right]              # the dividing wall only; the hall closes the
                              # other three. Leave `sides` out and every side
                              # the room does not already close is built,
                              # which is a cage standing in the middle.
  construction: mesh          # the question this case exists to answer. `mesh`
                              # is the 13 x 13 mm woven cage: the air crosses
                              # it and pays K once going in and once coming
                              # out. `drywall` is a solid partition -- switch
                              # this one word and run it again to see what the
                              # construction costs.
  aisle: 6                    # THE COLD AISLE THE CAGE WALL STANDS IN. A wall
                              # in an aisle halves it, and the row inside the
                              # cage and the row outside BOTH breathe from it
                              # -- so at the hall's own 1,20 m each of them
                              # would be left 0,60 m of cold aisle, which is a
                              # different room (ADR-099). 6,00 m here: 1,20 m
                              # of contained cold aisle and 1,20 m of walkway
                              # on each face of the wall, which is the 4,80 m
                              # the clearance needs plus the aisle itself.
                              # It can only widen what the clearance needs, and
                              # never narrow it (ADR-109). Only this aisle
                              # changes; the other five stay as `aisles.cold`
                              # drew them.
  clearance: 2.4              # WHERE the wall sits in that aisle, measured
                              # from the enclosed rows' faces -- on BOTH
                              # sides, so the aisle the wall stands in is at
                              # least twice this (ADR-109).
                              #
                              # It has to exceed `aisles.cold`, because this
                              # hall is run with the COLD aisle contained: a
                              # contained aisle cannot end on a cage wall, so
                              # it closes with a side of its own and the rest
                              # of the clearance is the walkway to the cage
                              # (ADR-110). 1,20 m of contained aisle from each
                              # row's faces leaves 1,20 m of walkway on each
                              # face of the wall.
                              # On the three sides the room closes, neither
                              # applies: the rectangle is clipped to the hall
                              # so the wall that IS built runs wall to wall.
                              # A free-standing cage in the middle of a room
                              # uses the clearance on all four sides instead:
                              # leave `cage.sides` out and set it to the gap
                              # the drawing dimensions.
  # height: omitted, so the cage runs to the false ceiling. A 2,4 m cage with
  # an open top is a different room and a legitimate thing to ask for instead
  # -- and the only way to build a DRYWALL one, which closed at the top would
  # leave the racks with an exit and no entry (ADR-096).
  roof: false

floor:
  # SUPPLY THROUGH THE FLOOR. The units stand in the room and discharge DOWN
  # through the deck; the air reaches the cold aisles through perforated
  # plates in the floor and returns through the ceiling grilles over the
  # contained hot aisles. That is the arrangement a downflow unit needs, and
  # naming one without it is refused by name (ADR-072, ADR-076).
  enabled: true
  height: 1.0                 # ASSUMED: neither document gives the plenum
                              # depth. 1,0 m is a common figure and it lands
                              # on the 0,20 m z cell. It sets the underfloor
                              # velocity, which is what decides whether the
                              # far plates deliver -- so on a real study it is
                              # a number to ask for, not to inherit.
  tiles_per_rack: 3           # Two plates in front of each cabinet. A 1,20 m
                              # cold aisle holds 1,20/0,60 = 2 rows of plate
                              # BETWEEN two facing rows, not two for each, so
                              # what is laid there is 2 and the summary says
                              # so by aisle (ADR-108). State
                              # `floor.tiles_across: 2` to say it outright, or
                              # widen `aisles.cold` to 2,40 m to fit all four.
                              # The aisle the cage wall stands in is wide
                              # enough to take them.

components:
  cage: cage-mesh-13          # 13 x 13 mm, 3 mm wire, 65% free area
  ceiling_return: ceiling-return-600-open
  supply_grille: supply-grille-2000

fanwall:
  # THE EMERSON CRACs THAT ARE INSTALLED. Everything below comes from
  # `equipment/P3100DA.yaml`, which carries the manufacturer's selection in
  # full -- 27.500 m3/h, 100,5 kW NET sensible at 30,0 degC return, supplying
  # 18,8 degC, at 37,6 degC of outdoor air on the condenser.
  #
  # DIRECT EXPANSION, AND THE EVAPORATOR IS MODELLED (ADR-103). The coil is
  # recovered from that selection's own psychrometry -- the 10,5 degC coil
  # surface its sensible/total split implies -- so the run asks the machine
  # what it does at the return THIS room produces instead of holding it at
  # the plate figure. At 26 degC of return, for instance, a unit gives about
  # 80 kW, not 100,5. What is still not modelled is the CONDENSING side: the
  # capacity holds at the selection's 37,6 degC outdoor air, and the report
  # says so in its limitations.
  model: P3100DA
  count: 14                   # what the project has installed: 7 a side, on
                              # the two gallery walls. 14 x 100,5 = 1.407 kW
                              # of rated capacity for 1.000 kW of IT, and
                              # 385.000 m3/h against the 268.500 the racks
                              # draw -- a plant sized with redundancy, which
                              # is what makes the per-unit capacity at the
                              # real return the number worth reading.
  static_pressure_pa: 50      # STATED HERE, not from the datasheet: neither
                              # the manufacturer's sheet nor the as-built
                              # gives an external static pressure for this
                              # machine, which is the one field keeping it out
                              # of `equipment.SHIPPED`. 100 Pa is the house
                              # figure for a downflow unit on a 1,0 m plenum;
                              # it decides the fan_capacity check and nothing
                              # else in this result.
  control: team               # each unit to its own return. `team` runs the
                              # units of one gallery to the worst return any
                              # of them sees, which is what a networked plant
                              # does -- and which now changes the answer for a
                              # DX plant too, because its coil is modelled
                              # (ADR-064, ADR-103).
  airflow_m3h: 27500
  capacity_kw: 100.5
  power_kw: 7.5
  width: 2.553
  height: 1.97
  depth: 0.873
  supply_temp_c: 18.8

grilles:
  size: 0.6
  coverage: 1.0               # the whole ceiling over each contained aisle
  free_area: 0.65             # the ceiling-return component's own figure
  across: 2

containment:
  enabled: true               # every COLD aisle is contained: a lid at rack
  aisle: cold                 # height and a door at each end, so the room
                              # around the rows is the hot one and the ceiling
                              # grilles take the return from it (ADR-100).
                              # Where the cage wall stands in one, the
                              # containment stops short of it and closes with
                              # a side of its own (ADR-110).

mesh:
  # Chosen so the ROOM is exact: every aisle, every rack band, the cage
  # clearance, the gallery and the perimeter land on a cell face. The two
  # warnings this case does print are the UNIT's own 1,777 m width and its
  # depth -- a machine is the size it is, and rounding the room to suit it
  # would be the wrong way round.
  # 0,20 m on all three axes: four cells across an 800 mm cabinet, and every
  # 1,20 m band, the perimeter, the gallery (4,4), the cage clearance (2,4)
  # and the aisle it stands in (6,0) are multiples of it. In z it holds the
  # rack (2,2), the false ceiling (4,0), the slab (5,6) and the 1,0 m plenum.
  # 620.136 cells: a uniform mesh, and the price of one fine enough in x to
  # resolve the cabinet rather than the row.
  cell_size: [0.3, 0.3, 0.25]

solver:
  max_iterations: 1600
  residual_tolerance: 1.0e-4
  sensor_interval: 100
  warm_start: true
  processors: 16

plenum:
  enabled: false
  as_mesh: false
  depth: 1.2
  grille:
    width: 1.2
    height: 3.2
